<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sky Auto Care</title>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f3f7fa;color:#222}
header{
background:linear-gradient(135deg,#087db5,#20b5df);
color:white;text-align:center;padding:35px 15px
}
header h1{margin:0;font-size:32px}
header p{margin:10px 0 0}
.container{max-width:700px;margin:auto;padding:18px}
.card{
background:white;padding:20px;margin-bottom:18px;
border-radius:18px;box-shadow:0 4px 15px #0002
}
h2{color:#087db5;margin-top:0}
.service{
border:1px solid #ddd;padding:15px;margin:10px 0;
border-radius:12px;display:flex;
justify-content:space-between;align-items:center
}
.price{color:#087db5;font-weight:bold}
button{
border:0;border-radius:12px;padding:13px 18px;
background:#087db5;color:white;font-size:16px;
cursor:pointer;width:100%;margin-top:10px
}
button:hover{background:#06648f}
input,select{
width:100%;padding:13px;margin:7px 0 12px;
border:1px solid #ddd;border-radius:10px;
font-size:16px
}
.whatsapp{background:#20a957}
.info{text-align:center;line-height:1.9}
footer{text-align:center;padding:20px;color:#777}
</style>
</head>

<body>

<header>
<h1>🚗 Sky Auto Care</h1>
<p>غسيل وصيانة سيارتك بسهولة</p>
</header>

<div class="container">

<div class="card">
<h2>خدماتنا</h2>

<div class="service">
<span>غسيل خارجي</span>
<span class="price">100 جنيه</span>
</div>

<div class="service">
<span>غسيل كامل</span>
<span class="price">150 جنيه</span>
</div>

<div class="service">
<span>غسيل VIP</span>
<span class="price">250 جنيه</span>
</div>

<div class="service">
<span>تغيير زيت</span>
<span class="price">حسب نوع الزيت</span>
</div>

<div class="service">
<span>فحص وصيانة</span>
<span class="price">حسب الخدمة</span>
</div>
</div>

<div class="card">
<h2>📅 احجز موعدك</h2>

<label>الاسم</label>
<input type="text" id="name" placeholder="اكتب اسمك">

<label>رقم الهاتف</label>
<input type="tel" id="phone" placeholder="01xxxxxxxxx">

<label>نوع السيارة</label>
<input type="text" id="car" placeholder="مثال: تويوتا كورولا">

<label>الخدمة</label>
<select id="service">
<option>غسيل خارجي
